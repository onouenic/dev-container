# Publica no host (só em 127.0.0.1, ver docker-compose.yml) os painéis web
# do Keycloak e do RabbitMQ. Os serviços em si ficam só na rede interna
# "devnet", sem internet; este gateway é um reverse proxy com destinos
# fixos, então não serve de caminho de saída para o agente.

# DNS interno do Docker; resolve na hora da requisição, para o gateway
# subir mesmo com o profile "auth" ou "db" desligado.
resolver 127.0.0.11 valid=10s ipv6=off;

# Console do Keycloak
server {
    listen 8080;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        set $upstream http://keycloak:8080;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Painel de management do RabbitMQ
server {
    listen 15672;

    location / {
        set $upstream http://rabbitmq:15672;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
    }
}
