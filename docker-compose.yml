# Topologia de rede (ver README, seção "Modelo de segurança"):
#
#   internet ◄── egress-proxy (allowlist por domínio) ◄──┐
#                     │ rede "egress"                     │
#                                                         │ rede "devnet" (internal: sem gateway,
#   dev-sandbox ──────────────────────────────────────────┘  sem internet, sem acesso ao host)
#        │
#        └──► mysql / postgres / mongodb / redis / rabbitmq / etcd / keycloak (também só na devnet)
#
#   host 127.0.0.1 ──► ui-gateway (rede "publish" + devnet) ──► painéis do Keycloak e RabbitMQ

# Endurecimento aplicado a todos os serviços de apoio.
x-service-hardening: &service-hardening
  security_opt:
    - no-new-privileges:true
  networks:
    - devnet
  restart: unless-stopped

services:
  dev-sandbox:
    build:
      context: ./sandbox
      args:
        TZ: America/Sao_Paulo
        # UID/GID do seu usuário no host (`id -u` / `id -g`). Obrigatório:
        # arquivos criados pelo agente precisam ter o seu dono no host.
        USER_UID: ${HOST_UID:?defina HOST_UID no .env (id -u)}
        USER_GID: ${HOST_GID:?defina HOST_GID no .env (id -g)}
    image: dev-sandbox:local
    container_name: dev-sandbox
    init: true
    user: node

    # Sem nenhuma capability, sem sudo, sem setuid efetivo: nem um processo
    # que explore algo dentro do container consegue virar root ou mexer em
    # rede. Filesystem da imagem somente leitura; escrita só em /workspace,
    # na home (volumes) e em /tmp.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2g

    # Runtime do container. "runsc" (gVisor) isola o kernel do host; precisa
    # estar instalado no Docker do host antes (ver README).
    runtime: ${SANDBOX_RUNTIME:-runc}

    mem_limit: ${SANDBOX_MEM_LIMIT:-6g}
    cpus: ${SANDBOX_CPUS:-4}
    pids_limit: ${SANDBOX_PIDS_LIMIT:-4096}

    # Só a rede interna. Toda saída para a internet passa pelo egress-proxy.
    networks:
      - devnet

    depends_on:
      egress-proxy:
        condition: service_started
      workspace-perms:
        condition: service_completed_successfully

    # WORKSPACE_DIR: diretório DEDICADO ao agente (ver README). Não aponte
    # para um diretório usado por serviços ou builds do host.
    volumes:
      - ${WORKSPACE_DIR:?defina WORKSPACE_DIR no .env}:/workspace
      # Diretrizes nicrobots como fonte ÚNICA, read-only: o agente segue
      # /opt/nicrobots (atualizado no host), não a cópia robots/ de cada
      # projeto. Read-only garante que ele não reescreva as próprias regras.
      - ${NICROBOTS_DIR:?defina NICROBOTS_DIR no .env}:/opt/nicrobots:ro
      - sandbox-home:/home/node
      - claude-code-config:/home/node/.claude
      - codex-config:/home/node/.codex
      - qwen-config:/home/node/.qwen
      - gh-config:/home/node/.config/gh
      - dev-bash-history:/commandhistory

    # Credenciais do GitHub como arquivos em /run/secrets, não env vars.
    secrets:
      - gh_token
      - gh_packages_token

    environment:
      - TZ=America/Sao_Paulo
      - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
      - DISABLE_AUTOUPDATER=1
      - GIT_USER_NAME=${GIT_USER_NAME:?defina GIT_USER_NAME no .env}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:?defina GIT_USER_EMAIL no .env}
      # Saída para a internet: sempre pelo egress-proxy. Mesmo um processo
      # que ignore essas variáveis não sai, porque a devnet não tem rota.
      - HTTP_PROXY=http://egress-proxy:3128
      - HTTPS_PROXY=http://egress-proxy:3128
      - http_proxy=http://egress-proxy:3128
      - https_proxy=http://egress-proxy:3128
      - NO_PROXY=localhost,127.0.0.1,::1,mysql,postgres,mongodb,redis,rabbitmq,etcd,keycloak,keycloak-db,docker-engine
      - no_proxy=localhost,127.0.0.1,::1,mysql,postgres,mongodb,redis,rabbitmq,etcd,keycloak,keycloak-db,docker-engine
      # Faz o fetch nativo do Node (corepack, apps) respeitar o HTTPS_PROXY.
      - NODE_USE_ENV_PROXY=1
      # Docker: o CLI do sandbox fala com o daemon do sidecar docker-engine.
      - DOCKER_HOST=tcp://docker-engine:2375
      # IP do egress-proxy: usado na config do Docker para que builds e
      # containers aninhados (que não resolvem nomes do compose) saiam pelo
      # proxy. Precisa bater com o ipv4_address do egress-proxy.
      - EGRESS_PROXY_IP=${EGRESS_PROXY_IP:-172.28.0.2}
      # Silencia só o aviso "EnvHttpProxyAgent is experimental" do item acima.
      - NODE_OPTIONS=--disable-warning=UNDICI-EHPA
      # Backend LLM do Qwen Code (OpenAI-compatible). Aponta para um gateway
      # compatível com a API da OpenAI; a saída passa pelo egress-proxy (allowlist).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      # Serviços de apoio: credenciais só de dev local. Os serviços não têm
      # internet nem porta publicada, então o valor não serve fora daqui.
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:?defina MYSQL_USER no .env}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
      - MYSQL_DATABASE=${MYSQL_DATABASE:?defina MYSQL_DATABASE no .env}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:?defina POSTGRES_USER no .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      - POSTGRES_DB=${POSTGRES_DB:?defina POSTGRES_DB no .env}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:?defina MONGO_ROOT_USER no .env}:${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD no .env}@mongodb:27017
      - ETCD_HOST=etcd
      - ETCD_ENDPOINTS=http://etcd:2379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:?defina RABBITMQ_USER no .env}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:?defina KEYCLOAK_ADMIN no .env}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD no .env}

    working_dir: /workspace
    command: ["/opt/sandbox/boot.sh"]
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Docker engine (sidecar dind): dá ao agente `docker build` e `docker run`
  # SEM afrouxar o dev-sandbox. O daemon roda aqui, isolado; o sandbox só
  # fala com ele pelo DOCKER_HOST. Containers que o agente subir nascem nesta
  # rede interna, atrás do egress-proxy — sem host nem LAN.
  #
  # Ligado por padrão. É a única peça com privilégio elevado: o afrouxamento
  # fica CONFINADO a este container. Optamos pelo dind rootful (não rootless)
  # porque é portável — não depende de user namespaces sem privilégio, que o
  # kernel de Ubuntu 24.04+ bloqueia por padrão (apparmor_restrict_
  # unprivileged_userns=1). O agente só alcança o daemon pela API, e os
  # containers dele ficam presos à devnet.
  docker-engine:
    image: docker:28-dind
    container_name: dev-docker-engine
    privileged: true
    environment:
      # Sem TLS: o socket TCP só existe na devnet interna, acessível apenas
      # pelo dev-sandbox.
      - DOCKER_TLS_CERTDIR=
      # Pull de imagens-base sai pela única rota permitida: o egress-proxy.
      - HTTP_PROXY=http://egress-proxy:3128
      - HTTPS_PROXY=http://egress-proxy:3128
      - http_proxy=http://egress-proxy:3128
      - https_proxy=http://egress-proxy:3128
      - NO_PROXY=localhost,127.0.0.1,::1
      - no_proxy=localhost,127.0.0.1,::1
    command: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
    networks:
      - devnet
    volumes:
      - dind-data:/var/lib/docker
    depends_on:
      egress-proxy:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Proxy de saída: único caminho do sandbox para a internet. Fica em duas
  # redes (devnet + egress) e libera só os domínios de proxy/allowlist.txt.
  # O agente não consegue alterá-lo: roda em outro container e o arquivo de
  # allowlist fica neste repositório, fora do WORKSPACE_DIR.
  # ---------------------------------------------------------------------
  egress-proxy:
    build:
      context: ./proxy
    image: dev-egress-proxy:local
    container_name: dev-egress-proxy
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    volumes:
      - ./proxy/allowlist.txt:/etc/squid/allowlist.txt:ro
    environment:
      - SANDBOX_SUBNET=${SANDBOX_SUBNET:-172.28.0.0/24}
      # Servidor Ollama / LLM local na rede (IPv4). Liberado só nessa porta.
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
    networks:
      # IP fixo: os builds/containers que o agente roda no docker-engine
      # ficam numa rede aninhada que NÃO resolve nomes do compose, então o
      # proxy é referenciado por IP na config do Docker (ver boot.sh). Se
      # mudar SANDBOX_SUBNET, ajuste EGRESS_PROXY_IP para caber nela.
      devnet:
        ipv4_address: ${EGRESS_PROXY_IP:-172.28.0.2}
      egress: {}
    mem_limit: 256m
    pids_limit: 256
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # One-shot antes do dev-sandbox: normaliza ownership do /workspace para
  # HOST_UID/HOST_GID (ver sandbox/fix-permissions.sh). Roda como root, mas
  # só com CAP_CHOWN/CAP_DAC_READ_SEARCH, sem rede, e sai. Nunca fica
  # acessível ao agente.
  # ---------------------------------------------------------------------
  workspace-perms:
    image: dev-sandbox:local
    container_name: dev-workspace-perms
    user: "0:0"
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ${WORKSPACE_DIR:?defina WORKSPACE_DIR no .env}:/workspace
    environment:
      - HOST_UID=${HOST_UID:?defina HOST_UID no .env (id -u)}
      - HOST_GID=${HOST_GID:?defina HOST_GID no .env (id -g)}
    command: ["/opt/sandbox/fix-permissions.sh"]
    restart: "no"

  # ---------------------------------------------------------------------
  # Bancos e auth, atrás de "profiles" — só sobem se você pedir:
  #   docker compose --profile db --profile auth up -d
  # ou COMPOSE_PROFILES=db,auth no .env.
  # Todos só na devnet (internal): sem internet e sem porta no host. Assim
  # nenhum deles vira ponte de saída (ex: COPY ... TO PROGRAM no Postgres,
  # REPLICAOF no Redis).
  # ---------------------------------------------------------------------

  mysql:
    <<: *service-hardening
    image: mysql:8.4
    profiles: ["db"]
    container_name: dev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *service-hardening
    image: redis:7.4
    profiles: ["db"]
    container_name: dev-redis
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes"]
    environment:
      # Lido pelo redis-server (acima) e pelo redis-cli do healthcheck, sem
      # a senha aparecer no compose como argumento.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    <<: *service-hardening
    image: rabbitmq:3.13-management
    profiles: ["db"]
    container_name: dev-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    <<: *service-hardening
    image: postgres:16
    profiles: ["db"]
    container_name: dev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    <<: *service-hardening
    image: mongo:7
    profiles: ["db"]
    container_name: dev-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    <<: *service-hardening
    image: quay.io/coreos/etcd:v3.5.21
    profiles: ["db"]
    container_name: dev-etcd
    # Sem auth (dev only): só alcançável pela devnet.
    command: >
      etcd
      --name dev-etcd
      --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://etcd:2380
      --initial-cluster dev-etcd=http://etcd:2380
      --initial-cluster-state new
    volumes:
      - etcd-data:/etcd-data

  keycloak-db:
    <<: *service-hardening
    image: postgres:16
    profiles: ["auth"]
    container_name: dev-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD no .env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    <<: *service-hardening
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["auth"]
    container_name: dev-keycloak
    # start-dev: só desenvolvimento local (sem HTTPS, sem cluster).
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      keycloak-db:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Painéis web no navegador do host, publicados só em 127.0.0.1 (não na
  # LAN). Os serviços continuam sem porta própria no host.
  # ---------------------------------------------------------------------
  ui-gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    profiles: ["db", "auth"]
    container_name: dev-ui-gateway
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    volumes:
      - ./ui-gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-18080}:8080"
      - "127.0.0.1:${RABBITMQ_UI_HOST_PORT:-18672}:15672"
    networks:
      - devnet
      - publish
    restart: unless-stopped

networks:
  # Interna: sem gateway para fora nem para o host.
  devnet:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        # ip_range restringe a alocação DINÂMICA à metade alta da subnet, para
        # que os IPs baixos (ex.: 172.28.0.2 do egress-proxy, ver
        # EGRESS_PROXY_IP) fiquem sempre livres para atribuição fixa, mesmo que
        # o proxy suba depois dos demais serviços. Sem isso, o primeiro serviço
        # a subir rouba o .2 e o proxy falha com "Address already in use".
        - subnet: ${SANDBOX_SUBNET:-172.28.0.0/24}
          ip_range: ${SANDBOX_DYNAMIC_RANGE:-172.28.0.128/25}
  # Saída do egress-proxy para a internet. IPv6 ligado: alguns destinos do
  # NIC.br (ex.: harbor.adm.devsys.nic.br) só têm endereço IPv6. Requer que o
  # daemon do host tenha IPv6 habilitado (ipv6+ip6tables). A devnet segue sem
  # IPv6 de propósito: só o proxy sai, os containers internos não.
  egress:
    enable_ipv6: true
  # Só para publicar as portas do ui-gateway em 127.0.0.1.
  publish:
    enable_ipv6: false

secrets:
  # Fine-grained PAT (push). Ver README, "Autenticação do agente".
  gh_token:
    file: ${GH_TOKEN_FILE:-./secrets/gh_token}
  # Classic PAT só com read:packages (npm.pkg.github.com).
  gh_packages_token:
    file: ${GH_PACKAGES_TOKEN_FILE:-./secrets/gh_packages_token}

volumes:
  sandbox-home:
  claude-code-config:
  codex-config:
  qwen-config:
  gh-config:
  dev-bash-history:
  dind-data:
  mysql-data:
  postgres-data:
  mongo-data:
  etcd-data:
  redis-data:
  rabbitmq-data:
  keycloak-db-data:
